<style>
:root{--surface-0:#f4f4f1;--surface-1:#fcfcfb;--surface-2:#ffffff;--line:#e3e2dc;--line-strong:#cfcec6;--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#7a7972;--accent:#2a78d6;--good:#1f7a3a;--warn:#9a6400;--danger:#c23a39;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--surface-0:#121211;--surface-1:#1a1a19;--surface-2:#222220;--line:#2f2f2c;--line-strong:#3e3e3a;--text-primary:#f0efec;--text-secondary:#c3c2b7;--text-muted:#8f8e86;--accent:#3987e5;--good:#4cc46a;--warn:#e0a630;--danger:#e66767;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--surface-0)}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--text-primary);font-size:14px;line-height:1.45}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.portal{max-width:880px;margin:0 auto;padding:28px 18px 60px}
.eyebrow{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
h1{font-size:24px;margin:2px 0 4px;letter-spacing:-.01em}
.foot{font-size:12.5px;color:var(--text-muted)}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.summary div{background:var(--surface-1);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:120px}
.summary b{display:block;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:500}
.summary span{font-size:12px;color:var(--text-secondary)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);color:var(--text-primary)}
.toolbar input{flex:1;min-width:200px}
.pcard{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.pcard-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:flex-start}
.ref{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500}
.route{color:var(--text-secondary);font-size:13.5px;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--text-secondary);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--text-muted)}
.badge.Delivered::before{background:var(--good)}.badge.In-Transit::before{background:var(--accent)}.badge.At-Port-Customs::before{background:var(--warn)}.badge.Cancelled::before{background:var(--danger)}
.note{margin-top:10px;font-size:13.5px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:4px}
.prog{display:flex;gap:4px;margin:14px 0 4px}.prog div{flex:1;height:6px;border-radius:3px;background:var(--line)}.prog div.on{background:var(--accent)}
.progl{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);gap:4px}
.progl span{flex:1;text-align:center}.progl span:first-child{text-align:left}.progl span:last-child{text-align:right}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 18px;margin-top:14px;font-size:13px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted)}.v{margin-top:2px;word-break:break-word}
.docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.docs span{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--text-secondary)}
.docs span.y{border-color:var(--good);color:var(--good)}
.tl{list-style:none;margin:14px 0 0;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 10px 16px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface-1);border:2px solid var(--line-strong)}
.tl li.done::before{background:var(--accent);border-color:var(--accent)}
.tl .d{color:var(--text-muted);font-size:12px}
a.link{color:var(--accent);font-size:13px}
details.past summary{cursor:pointer;color:var(--text-secondary);font-size:13.5px;margin:10px 0 12px}
.empty{color:var(--text-muted);text-align:center;padding:24px}
</style></head><body>

<script>
(function(){"use strict";
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtDate(s){if(!s)return '';var p=s.split('-');var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return M[+p[1]-1]+' '+(+p[2])+', '+p[0];}
var DOCS=['BOL / AWB','Commercial invoice','Packing list','ISF filed','Customs entry filed','Delivery order','Proof of delivery'];
function transportLabel(m){return m==='Air freight'?'Flight number':m==='Domestic truck'?'Truck / tracking number':'Vessel / voyage';}
function stages(m){return m==='Domestic truck'?['Booked','Picked up','In transit','Delivered']:['Booked','Departed','Arrived','Customs cleared','Delivered'];}
function stageOf(s){var last=stages(s.mode).length-1;
  if(s.status==='Delivered')return last;
  if(s.status==='At Port / Customs')return 2;
  if(s.status==='In Transit'){if(/customs released/i.test(s.clientNote||''))return Math.min(3,last);return s.mode==='Domestic truck'?2:1;}
  return 0;}
var TE=new TextEncoder(),TD=new TextDecoder();
function fromB64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function hex(u8){return Array.prototype.map.call(u8,function(b){return (b<16?'0':'')+b.toString(16);}).join('');}
async function tokenKey(t){var raw=await crypto.subtle.digest('SHA-256',TE.encode('shipdash-key:'+t));return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);}
async function tokenLookup(t){var h=new Uint8Array(await crypto.subtle.digest('SHA-256',TE.encode('shipdash-id:'+t)));return hex(h.slice(0,12));}
async function dec(key,box){var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(box.iv)},key,fromB64(box.ct));return JSON.parse(TD.decode(pt));}
var DATA;try{DATA=JSON.parse($('data').textContent);}catch(e){DATA={portals:{}};}
var view={q:'',st:''},D=null;
function card(s){var st=stages(s.mode),cur=stageOf(s);
  var h='<div class="pcard"><div class="pcard-h"><div><div class="ref">'+esc(s.ref)+'</div><div class="route">'+(s.origin?esc(s.origin)+' to ':'To ')+esc(s.destination||'destination to be confirmed')+'</div></div><span class="badge '+esc((s.status||'').replace(/[^A-Za-z]+/g,'-'))+'">'+esc(s.status||'Pending')+'</span></div>';
  if(s.clientNote)h+='<div class="note">'+esc(s.clientNote)+'</div>';
  if(s.status!=='Cancelled')h+='<div class="prog">'+st.map(function(_,i){return '<div class="'+(i<=cur?'on':'')+'"></div>';}).join('')+'</div><div class="progl">'+st.map(function(n,i){return '<span style="'+(i===cur?'color:var(--text-primary);font-weight:600':'')+'">'+esc(n)+'</span>';}).join('')+'</div>';
  var f=[];
  if(s.deliveryDate)f.push(['Delivered',fmtDate(s.deliveryDate)]);else f.push(['Estimated arrival',s.eta?fmtDate(s.eta):'To be confirmed']);
  if(s.shipDate)f.push([s.mode==='Domestic truck'?'Picked up':'Departed',fmtDate(s.shipDate)]);
  f.push(['Shipment',(s.mode||'')+(s.equipment?', '+(s.qty>1?s.qty+' x ':'')+s.equipment:'')]);
  if(s.project)f.push(['Project / PO',s.project]);
  if(s.originCountry)f.push(['Country of origin',s.originCountry]);
  if(s.transportRef)f.push([transportLabel(s.mode),s.transportRef]);
  if(s.carrier)f.push(['Carrier',s.carrier]);
  if(s.containers)f.push(['Containers',s.containers]);
  h+='<div class="facts">'+f.map(function(x){return '<div><div class="k">'+esc(x[0])+'</div><div class="v'+(x[0]==='Containers'?' mono':'')+'">'+esc(x[1])+'</div></div>';}).join('')+'</div>';
  if(s.docs)h+='<div style="margin-top:12px"><div class="k">Documents</div><div class="docs">'+DOCS.map(function(d){var y=s.docs.indexOf(d)>=0;return '<span class="'+(y?'y':'')+'">'+(y?'&#10003; ':'')+esc(d)+'</span>';}).join('')+'</div></div>';
  if(s.trackingLink&&/^https:\/\//.test(s.trackingLink))h+='<div style="margin-top:12px"><a class="link" href="'+esc(s.trackingLink)+'" target="_blank" rel="noopener">Track with the carrier</a></div>';
  return h+'</div>';}
function draw(){var q=view.q.toLowerCase();
  var list=D.shipments.filter(function(s){if(view.st&&s.status!==view.st)return false;if(q){var hay=[s.ref,s.project,s.destination,s.transportRef,s.containers].join(' ').toLowerCase();if(hay.indexOf(q)<0)return false;}return true;});
  var act=list.filter(function(s){return s.status!=='Delivered'&&s.status!=='Cancelled';}).sort(function(a,b){return (a.eta||'9999').localeCompare(b.eta||'9999');});
  var done=list.filter(function(s){return s.status==='Delivered'||s.status==='Cancelled';}).sort(function(a,b){return (b.deliveryDate||'').localeCompare(a.deliveryDate||'');});
  $('list').innerHTML=(act.length?act.map(card).join(''):'<div class="pcard empty">No active shipments'+(q||view.st?' match your search':'')+'.</div>')+(done.length?'<details class="past"'+(q?' open':'')+'><summary>Delivered shipments ('+done.length+')</summary>'+done.map(card).join('')+'</details>':'');}
function render(d){D=d;var all=d.shipments;var cnt=function(st){return all.filter(function(s){return s.status===st;}).length;};
  var upd=d.updated?new Date(d.updated):null;
  $('root').innerHTML='<div class="eyebrow">'+esc(d.company?d.company+' shipment tracking':'Shipment tracking')+'</div><h1>'+esc(d.name)+'</h1><div class="foot">'+(upd?'Last updated '+upd.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'')+'. Updates are entered by your logistics coordinator; dates may change.</div>'+
  '<div class="summary"><div><b>'+(cnt('In Transit')+cnt('At Port / Customs'))+'</b><span>In transit or at port</span></div><div><b>'+cnt('Booked')+'</b><span>Booked</span></div><div><b>'+cnt('Delivered')+'</b><span>Delivered</span></div></div>'+
  '<div class="toolbar"><input id="q" type="search" placeholder="Search reference, project, container or vessel" aria-label="Search shipments"><select id="st" aria-label="Filter by status"><option value="">All statuses</option><option>Booked</option><option>In Transit</option><option>At Port / Customs</option><option>Delivered</option></select></div><div id="list"></div>';
  $('q').addEventListener('input',function(){view.q=this.value;draw();});$('st').addEventListener('change',function(){view.st=this.value;draw();});draw();}
function notFound(){$('root').innerHTML='<div class="pcard"><h1 style="font-size:18px">Tracking link needed</h1><div class="foot" style="margin-top:6px">Open this page with the tracking link your logistics coordinator sent you. If your link stopped working, ask them for a current one.</div></div>';}
async function boot(){var h=location.hash.slice(1);var m=h.match(/^t-([0-9a-f]{32})$/);if(!m||!window.crypto||!crypto.subtle){notFound();return;}
  try{var box=DATA.portals&&DATA.portals[await tokenLookup(m[1])];if(!box)throw 0;render(await dec(await tokenKey(m[1]),box));}catch(e){notFound();}}
window.addEventListener('hashchange',boot);boot();
})();
</script></body></html>
